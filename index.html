
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Foxor Random</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 560px);
      text-align: center;
    }

    .logo {
      color: #ff791f;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1.5px;
    }

    .subtitle { color: #999; }

    .panel {
      margin-top: 30px;
      padding: 28px;
      border: 1px solid #333;
      border-radius: 20px;
      background: #1b1b1b;
    }

    label {
      display: block;
      text-align: left;
      margin: 16px 0 8px;
      color: #ccc;
    }

    select, button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
    }

    select {
      background: #252525;
      color: white;
      border: 1px solid #444;
    }

    button {
      margin-top: 20px;
      border: none;
      background: #ff791f;
      color: #111;
      font-weight: 800;
      cursor: pointer;
      transition: .2s;
    }

    button:hover {
      background: #ff984e;
      transform: translateY(-2px);
    }

    #result {
      margin-top: 24px;
      padding: 20px;
      background: #252525;
      border-radius: 12px;
      min-height: 90px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    footer {
      margin-top: 28px;
      color: #777;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">Foxor Random</div>
    <p class="subtitle">Your next idea starts with one spin.</p>

    <section class="panel">
      <label for="platform">Choose a platform</label>
      <select id="platform">
        <option>YouTube</option>
        <option>GitHub</option>
        <option>Odysee</option>
        <option>Internet Archive</option>
        <option>Personal Website</option>
        <option>Any Platform</option>
      </select>

      <label for="activity">Choose an activity</label>
      <select id="activity">
        <option>Uploading</option>
        <option>Publishing</option>
        <option>Preserving</option>
        <option>Creating</option>
        <option>Archiving</option>
        <option>Any Activity</option>
      </select>

      <button onclick="generateIdea()">Generate Idea</button>

      <div id="result" aria-live="polite">
        Your next project will appear here.
      </div>

      <button onclick="copyIdea()" style="background:#333;color:white">
        Copy Idea
      </button>
    </section>

    <footer>
      Foxor Random · An independent FoxPhantom203 project
    </footer>
  </main>

  <script>
    const platforms = [
      "YouTube",
      "GitHub",
      "Odysee",
      "Internet Archive",
      "Personal Website"
    ];

    const activities = [
      "Upload a creative project",
      "Publish an open-source tool",
      "Preserve nostalgic digital media",
      "Create a useful web application",
      "Start a digital collection",
      "Build a community project",
      "Document an interesting discovery",
      "Create a tutorial"
    ];

    let currentIdea = "";

    function generateIdea() {
      const selectedPlatform =
        document.getElementById("platform").value;

      const selectedActivity =
        document.getElementById("activity").value;

      const platform = selectedPlatform === "Any Platform"
        ? platforms[Math.floor(Math.random() * platforms.length)]
        : selectedPlatform;

      const activity = selectedActivity === "Any Activity"
        ? activities[Math.floor(Math.random() * activities.length)]
        : selectedActivity;

      currentIdea = `${activity} on ${platform}.`;

      document.getElementById("result").textContent =
        currentIdea;
    }

    async function copyIdea() {
      if (!currentIdea) return;

      try {
        await navigator.clipboard.writeText(currentIdea);
        document.getElementById("result").textContent =
          currentIdea + " (Copied!)";
      } catch {
        document.getElementById("result").textContent =
          "Copy unavailable. Please select the idea manually.";
      }
    } 
  </script>
</body>
</html>
